name: Obsidian
version: "0.8.1"
slug: obsidian
description: Runs Obsidian within your Home Assistant setup providing integration of live-features
url: https://github.com/ibidani/ha-obsidian/tree/master/obsidian
webui: http://[HOST]:[PORT:3000]
panel_icon: "mdi:note-edit"
arch:
  - aarch64
  - amd64

# Prefer ingress for external access via the supervisor.
ingress: true
ingress_port: 3000

# Expose the web/VNC ports as optional host binds; null = not published.
ports:
  3000/tcp: null
  3001/tcp: null
  8082/tcp: null
ports_description:
  3000/tcp: "Obsidian web interface"
  3001/tcp: "Desktop / noVNC port"
  8082/tcp: "Alternative VNC port"

# Supervisor does not run on our behalf; base image runs its own s6-overlay init.
init: false

# Container-scoped tmpfs for volatile runtime files.
tmpfs: true

# Persist config across restarts.
map:
  - type: addon_config
    read_only: False
    path: /config
  - type: share
    read_only: False
    path: /share

environment:
  PUID: "1000"
  PGID: "1000"
  START_DOCKER: "false"
  TITLE: "Obsidian"
  NO_GAMEPAD: "true"
  DISABLE_DRI3: "true"
  PIXELFLUX_WAYLAND: "false"
  SELKIES_UI_SHOW_SIDEBAR: "false"
  NO_DECOR: "true"
  # Cap the virtual framebuffer: the default Xvfb screen (15360x8640) uses
  # ~500 MB of RAM; 3840x2160 cuts the container footprint almost in half
  # with no functional difference for the ingress UI.
  MAX_RES: "3840x2160"

image: "ghcr.io/ibidani/ha-obsidian"
